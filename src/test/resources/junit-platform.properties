# Run sequentially: Playwright for Java objects are not thread-safe (see BaseUiTest for how to parallelise).
junit.jupiter.execution.parallel.enabled=false
# Use @DisplayName / readable names in console and reports.
junit.jupiter.displayname.generator.default=org.junit.jupiter.api.DisplayNameGenerator$ReplaceUnderscores

# Cucumber: suppress the "publish your report online" banner
cucumber.publish.quiet=true
